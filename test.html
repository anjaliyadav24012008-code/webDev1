<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
</head>
<body>
    <form>
    <h1>STUDENT REGISTRATION FORM</h1>
    <p>please fill in the details below.</p>
    <fieldset>
<legend>Personal Information</legend>
<label for="name">Full name:</label>
<input type="text" name="name" id="name">
<br>
<br>
<label for="number">Mobile Number</label>
<input type="number" id="number" number="no">
<br>
<br>
<label for="email">Email</label>
<input type="email" id="email">
<br>
<br>
<label for="pass">Password</label>
<input type="password" id="pass" >
<br>
<br>
<label for="number">Age</label>
<input type="number" id="age" >
<br>
<br>
<label for="gen">Gender:</label>
<input type="radio" name="gender" >Male
<input type="radio" name="gender" >Female
    </fieldset>
    <br>

    <label for="date">Date of Birth</label>
    <input type="date" id="date" name="date">
    <br>
    <br>
    <fieldset>
<legend>Additional Information</legend>
<label for="">Interests:</label>
<input type="checkbox" id="in" name="in1">
<label for="in">coding</label>
<input type="checkbox" id="in2" name="in2">
<label for="in2">sports</label>
<input type="checkbox" id="in3" name="in3">
<label for="in3">music</label>
<br>
<br>

<label for="s">Select Course</label>
<select name="course" id="s">
<option value="bca">BCA</option>
<option value="btech">B.TECH</option>
<option value="mba">MBA</option>
</select>
    </fieldset>
    <br>
    <label for="resume">Upload Resume</label>
    <input type="file" name="resume" id="resume">
    <br>
    <h5>why do want to join this course?</h5>
    <textarea name="text" id="comm"
    rows="4";
    cols="20"
    >
    </textarea>
    <br>
    <br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">
    </form>
</body>
</html>
