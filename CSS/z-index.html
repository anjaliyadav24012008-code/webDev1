<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index</title>
    <style>
img{
    position:absolute;
    left:0;
    top:0;
    z-index: -1;
  
}
p{
    font-size:25px;
    text-align: center;
}
    </style>
</head>
<body>
    <h1 style="color:white">hello anjali:</h1>
    <img src="anjali.jpg" alt="image of anjali" >
    <p style="color:white">this is the image of anjali and trying to learn z-index</p>
</body>
</html>
